# Tracker solaire : interface web + compilation + flashage OTA du firmware.
#
#   Interface web (tourne en permanence, derriere le Nginx du serveur) :
#     ./definir-mot-de-passe.sh                            (1 fois)
#     docker compose up -d tracker-web
#
#   Firmware :
#     docker compose build tracker-build                   (1 fois, long)
#     docker compose run --rm tracker-build                (compile)
#     docker compose --profile flash run --rm tracker-ota  (envoie a la carte)
#
# Le flashage est dans un "profil" : il ne se lance JAMAIS par accident
# avec un simple "docker compose up".

services:
  # ------------------------------------------------------------------
  # Interface web : mot de passe, pages servies par le serveur, commandes
  # relayees a l'ESP32 sur le reseau local.
  #
  # Place DERRIERE le Nginx du serveur, qui garde les ports 80/443, le nom
  # de domaine et le certificat HTTPS :
  #   Internet --HTTPS--> Nginx --HTTP--> tracker-web --HTTP--> ESP32
  # Le mot de passe reste verifie ICI, quelle que soit la config de Nginx.
  # ------------------------------------------------------------------
  tracker-web:
    build:
      # Racine du depot : l'image lit les pages HTML dans le firmware.
      # Le .dockerignore de la racine n'y laisse entrer que ces pages.
      context: ..
      dockerfile: tracker_docker/web/Dockerfile
    image: tracker-web:54
    restart: unless-stopped
    # Seules les variables utiles sont transmises (pas le mot de passe OTA).
    environment:
      # HTTP simple sur le port 80 du conteneur : le HTTPS est fait par Nginx.
      SITE_ADDRESS: ":80"
      ESP32_URL: ${ESP32_URL:-http://192.168.1.60}
      WEB_USER: ${WEB_USER:-}
      WEB_PASSWORD_HASH: ${WEB_PASSWORD_HASH:-}
    # Aucun port publie sur le reseau : seuls Nginx (via le reseau Docker
    # partage) et le serveur lui-meme (127.0.0.1, pour tester) y accedent.
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    networks:
      default:
      proxy:
        # Nom sous lequel Nginx joint ce service : http://tracker-web:80
        aliases: [tracker-web]

  # ------------------------------------------------------------------
  # Compilation du firmware (image de ton pere, inchangee)
  # ------------------------------------------------------------------
  tracker-build:
    build: .
    image: tracker-firmware-build:54
    volumes:
      # Le code source est monte, jamais copie dans l'image (Secrets.h
      # contient des mots de passe). Chemin relatif a ce dossier.
      - ../tracker_web_control54:/work/tracker_web_control54:ro
      # Binaire + cache de compilation : les recompilations suivantes sont rapides.
      - tracker-out:/out

  # ------------------------------------------------------------------
  # Flashage OTA (image de ton pere, inchangee)
  # ------------------------------------------------------------------
  tracker-ota:
    profiles: ["flash"]
    image: tracker-firmware-build:54
    # L'ESP32 se reconnecte au serveur pendant le transfert : le reseau "bridge"
    # de Docker (NAT) empeche ce retour. Le mode host est necessaire (Linux).
    network_mode: host
    env_file: .env
    volumes:
      - tracker-out:/out:ro
    command: flash-ota.sh

volumes:
  tracker-out:

networks:
  # Reseau Docker de ton Nginx (le trouver avec : docker network ls).
  # tracker-web s'y branche pour que Nginx puisse le joindre par son nom.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
